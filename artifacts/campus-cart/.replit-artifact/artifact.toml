kind = "web"
previewPath = "/"
title = "Campus Cart"
description = "A private Notre Dame research pilot for capturing shopping requests, measuring card-setup interest without charges, and viewing anonymized participant research data."
version = "1.0.0"
id = "artifacts/campus-cart"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26051

[services.development]
run = "pnpm --filter @workspace/campus-cart run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/campus-cart", "run", "build" ]
serve = "static"
publicDir = "artifacts/campus-cart/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26051"
BASE_PATH = "/"
